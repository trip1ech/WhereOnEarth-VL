<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Road-Marking Annotator · WhereOnEarth-VL</title>
  <link href="/app.css" rel="stylesheet">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="header">
      <div>
        <p class="project">WhereOnEarth-VL</p>
        <h1>Road-Marking Annotator</h1>
      </div>
      <div class="header-actions">
        <label for="dataset">Dataset</label>
        <select id="dataset" disabled></select>
        <a class="export" id="export" aria-disabled="true">Export JSONL</a>
      </div>
    </header>

    <div class="layout">
      <section class="photo-card" aria-label="Photo to annotate">
        <div class="photo-header">
          <span id="sample">Loading</span>
          <span class="image-size">Model input · 512 px max edge</span>
        </div>
        <div class="viewer" id="viewer"></div>
        <nav class="navigation" aria-label="Browse photos">
          <button id="previous" type="button" disabled>Previous</button>
          <button id="next-unlabeled" type="button" disabled>Next unlabeled</button>
          <button id="next" type="button" disabled>Next</button>
        </nav>
      </section>

      <aside class="label-panel">
        <section aria-labelledby="question">
          <h2 id="question">How many center lines divide opposing traffic?</h2>
          <p class="instructions">Count only center markings dividing opposing lanes. Solid and dashed lines both count; ignore shoulder/edge lines and same-direction lane lines.</p>
          <div class="options">
            <button class="label" data-label="single" type="button" aria-pressed="false" disabled>
              <kbd>1</kbd><span><strong>Single line</strong><small>One solid or dashed line</small></span>
            </button>
            <button class="label" data-label="double" type="button" aria-pressed="false" disabled>
              <kbd>2</kbd><span><strong>Double line</strong><small>Two parallel lines side by side</small></span>
            </button>
            <button class="label" data-label="none" type="button" aria-pressed="false" disabled>
              <kbd>3</kbd><span><strong>No center line</strong><small>Road center clearly visible with no markings</small></span>
            </button>
            <button class="label" data-label="unclear" type="button" aria-pressed="false" disabled>
              <kbd>4</kbd><span><strong>Unclear / N/A</strong><small>Occluded, blurry, no road, or ambiguous</small></span>
            </button>
          </div>
          <button id="clear" type="button" class="quiet" disabled>Clear label</button>
        </section>
        <footer class="progress-area">
          <progress id="progress" value="0" max="1" aria-label="Annotation progress"></progress>
          <p id="count">Labeled 0</p>
          <p id="class-counts"></p>
          <p id="status" role="status" aria-live="polite"></p>
        </footer>
      </aside>
    </div>
  </main>
</body>
</html>
