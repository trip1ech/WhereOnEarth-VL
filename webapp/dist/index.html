<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fa">
  <title>Street-View Prediction Comparator · WhereOnEarth-VL</title>
  <link rel="stylesheet" href="assets/leaflet.css">
  <link rel="stylesheet" href="assets/app.css">
  <script defer src="assets/leaflet.js"></script>
  <script defer src="assets/basemap.js"></script>
  <script defer src="assets/data.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body>
  <main class="workspace">
    <header class="masthead">
      <div>
        <p class="project-name">WhereOnEarth-VL</p>
        <h1>Street-View Prediction Comparator</h1>
      </div>
      <label class="control">
        <span>Model Version</span>
        <select id="version">
          <option value="sft">6,000-Image QLoRA</option>
          <option value="sft_2000">2,000-Image QLoRA</option>
        </select>
      </label>
    </header>

    <section class="sample" aria-label="Evaluation photo">
      <div class="sample-toolbar">
        <nav class="navigation" aria-label="Switch photo">
          <button id="previous" type="button" class="arrow" aria-label="Previous" title="Previous">←</button>
          <label class="control picture-picker">
            <span class="visually-hidden">Photo</span>
            <select id="picture"></select>
          </label>
          <button id="next" type="button" class="arrow" aria-label="Next" title="Next">→</button>
        </nav>
        <label class="control">
          <span>Filter</span>
          <select id="filter">
            <option value="all">All photos</option>
            <option value="better">Closer after fine-tuning</option>
            <option value="worse">Farther after fine-tuning</option>
            <option value="missing">Missing valid coordinates</option>
          </select>
        </label>
      </div>
      <figure>
        <div class="photo-frame">
          <img id="photo" alt="Street-view photo evaluated by both models">
          <p id="photo-error" hidden>Unable to load street-view photo</p>
        </div>
        <figcaption>
          <span><span class="truth-dot"></span> Ground Truth <strong id="truth"></strong></span>
          <span id="credit"></span>
        </figcaption>
      </figure>
    </section>

    <section class="comparison" aria-label="Prediction maps">
      <div class="comparison-toolbar">
        <span id="comparison-result" class="comparison-result" aria-live="polite"></span>
        <div class="map-controls">
          <label class="sync-control"><input id="sync" type="checkbox" checked> Sync maps</label>
          <button type="button" id="reset">Reset view</button>
        </div>
      </div>
      <div class="map-grid">
        <article class="map-card zero">
          <header class="model-heading">
            <div>
              <h2>Zero-shot</h2>
              <p id="country-zero"></p>
            </div>
            <strong class="distance" id="distance-zero"></strong>
          </header>
          <div id="map-zero" class="map" role="region" aria-label="Zero-shot prediction map"></div>
          <p class="metrics" id="metrics-zero"></p>
        </article>
        <article class="map-card fine">
          <header class="model-heading">
            <div>
              <h2 id="fine-title">6,000-Image QLoRA</h2>
              <p id="country-fine"></p>
            </div>
            <strong class="distance" id="distance-fine"></strong>
          </header>
          <div id="map-fine" class="map" role="region" aria-label="Fine-tuned prediction map"></div>
          <p class="metrics" id="metrics-fine"></p>
        </article>
      </div>
      <footer class="comparison-footer">
        <div class="legend" aria-label="Map legend">
          <span><i class="truth-dot"></i> Ground Truth</span>
          <span><i class="zero-dot"></i> Zero-shot</span>
          <span><i class="fine-dot"></i> Fine-tuned</span>
        </div>
        <p>Summary spans the same <span id="total"></span> photos. Median distance is computed over valid coordinates.</p>
      </footer>
    </section>
  </main>
</body>
</html>
